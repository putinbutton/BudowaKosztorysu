<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista kosztorysów</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navigation}"></div>
<h1>Kosztorysy</h1>
<a th:href="@{/estimates/new}">Nowy kosztorys</a>

<table border="1">
    <thead>
    <tr>
        <th>Projekt</th>
        <th>Data</th>
        <th>Suma</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="estimate : ${estimates}">
        <td data-label="Projekt" th:text="${estimate.projectName}"></td>
        <td data-label="Data" th:text="${estimate.creationDate}"></td>
        <td data-label="Suma" th:text="${#numbers.formatDecimal(estimate.totalAmount, 1, 2)}"></td>
        <td data-label="Akcje"><a th:href="@{/estimates/{id}(id=${estimate.id})}">Szczegóły</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
