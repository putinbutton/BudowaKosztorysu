<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista klientów</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: navigation}"></div>
    <h1>Klienci</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Imię i nazwisko</th>
                <th>Telefon</th>
                <th>Email</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="client : ${clients}">
                <td data-label="Imię i nazwisko" th:text="${client.name}"></td>
                <td data-label="Telefon" th:text="${client.phoneNumber}"></td>
                <td data-label="Email" th:text="${client.email}"></td>
                <td data-label="Akcje">
                    <a th:href="@{/clients/{id}/edit(id=${client.id})}">Edytuj</a>
                </td>
                <td data-label="Akcje">
                    <form th:action="@{/clients/{id}/delete-confirm(id=${client.id})}" method="get" style="display:inline">
                        <button type="submit">Usuń</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/clients/new}">Dodaj nowego klienta</a>
</body>
</html>
